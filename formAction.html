<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento confirmado</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/formAction.css">
</head>

<body>
    <header id="menu"></header>
    <script src="script/menu.js"></script>

    <main>
        <h1 id="titulo">Agendamento confirmado</h1>

        <!-- Comprovantes -->
        <section class="comprovante" id="comprovante">
            <p>Nome: <span id="nomeCliente"></span></p>
            <p>Telefone: <span id="telefone"></span></p>
            <p>E-mail: <span id="email"></span></p>
            <p>Data: <span id="data"></span></p>
            <p>Horário: <span id="horario"></span></p>
            <p>Barbeiro: <span id="nomeBarbeiro"></span></p>
            <p>Serviço: <span id="tipoServico"></span></p>
        </section>

        <!-- Ações do comprovante -->
        <div class="acoes">
            <button type="button" class="btn" id="imprimir">Imprimir comprovante</button>
            <a href="form.html" class="btn">Novo agendamento</a>
        </div>
    </main>

    <script src="script/formActionGET.js"></script>
</body>

</html>
