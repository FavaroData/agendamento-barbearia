<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">
    <script src="script/form.js" defer></script>
    <title>Agendamento</title>
</head>
<body>
    <div class="menu">
        <ul>
            <li><a href="index.html">Menu principal</a></li>
            <li><a href="form.html">Agendar</a></li>
            <li><a href="paginas/about.html">Sobre</a></li>
            <li><a href="formAction.html">Agendamentos</a></li>
        </ul>
    </div>
    <div id="agendamento" class="agendamento">
        <form id="agendamentoForm" action="">
            <p>Nome Completo</p>
            <input type="text" name="nome" id="agendamentoNome" class="input required" oninput="validarNome()">
            <span class="span-required">Digite o nome completo</span>
            
            <p>Telefone</p>
            <input type="text" name="telefone" id="agendamentoTelefone" class="input required" oninput="validarTelefone()">
            <span class="span-required">Digite um número de telefone válido</span>

            <p>Email</p>
            <input type="text" name="email" id="agendamentoEmail" class="input required" oninput="validarEmail()">
            <span class="span-required">Digite um email válido</span>
            
            <p>Serviço Desejado</p>
            <input type="radio" name="servico1" id="agendamentoServicoCabelo" > Corte de Cabelo
            <input type="radio" name="servico2" id="agendamentoServicoBarba"> Barba
            <input type="radio" name="servico2" id="agendamentoServicoBarba"> Cabelo e Barba
            
            <p> Data do Agendamento</p>
            <select name="data" id="agendamentoData" class="input required">
                <option value="">Selecione uma Data</option>
            </select>
            <p> Horario Desejado </p>
            <select name="horario" id="agendamentoHorario" class="input required">
                <option value="">Selecione um Horario</option>
            </select>
        </form>
    </div>
    <p id="teste"></p>
</body>
</html>
