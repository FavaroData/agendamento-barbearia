<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/form.js"></script>
    <title>Agendamento</title>
</head>
<body>
    <div id="agendamento" class="agendamento">
        <form action="">
            <p>Nome Completo</p>
            <input type="text" name="nome" id="agendamentoNome">
            <p>Telefone</p>
            <input type="text" name="telefone" id="agendamentoTelefone">
            <p>Serviço Desejado</p>
            <input type="checkbox" name="servico1" id="agendamentoServicoCabelo"> Corte de Cabelo
            <input type="checkbox" name="servico2" id="agendamentoServicoBarba"> Barba
            <input type="checkbox" name="servico2" id="agendamentoServicoBarba"> Cabelo e Barba
            <p> Data do Agendamento</p>
            <select name="data" id="agendamentoData" required>
                <option value="">Selecione uma Data</option>
            </select>
            <p> Horario Desejado </p>
            <select name="horario" id="agendamentoHorario" required>
                <option value="">Selecione um Horario</option>
            </select>
        </form>
    </div>
</body>
</html>
